name: Pack & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PRIVATE_FEED_URL: 'https://pkgs.dev.azure.com/ecocoachsmarthome/Ecocoach/_packaging/ecocoach.csharplogicsystem/nuget/v3/index.json'

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for nuget.org Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure private feed
        run: |
          dotnet nuget add source "$PRIVATE_FEED_URL" \
            --name PrivateFeed \
            --username AzureDevOps \
            --password "${{ secrets.AZURE_DEVOPS_PAT }}" \
            --store-password-in-clear-text

      - name: Build
        run: dotnet build Vion.Contracts.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >
          dotnet pack Vion.Contracts.sln -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -o ./artifacts

      - name: Push to private feed
        if: github.event_name != 'pull_request'
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source PrivateFeed
          --api-key ${{ secrets.AZURE_DEVOPS_PAT }}
          --skip-duplicate

      # Trusted Publishing: request a short-lived API key via OIDC.
      # Temp key is valid for 1 hour, so do this immediately before push.
      - name: Debug — show OIDC claims
        if: steps.version.outputs.is_release == 'true'
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://www.nuget.org" | jq -r .value)
          PAYLOAD=$(echo -n "$TOKEN" | cut -d. -f2)
          # base64url decode (add padding)
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ "$MOD" = 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
          if [ "$MOD" = 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d | jq '{sub, repository, repository_owner, workflow_ref, job_workflow_ref, event_name, ref}'

      - name: NuGet login (OIDC) — hardcoded individual user for diagnosis
        if: steps.version.outputs.is_release == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: JonasBertsch

      - name: Push to nuget.org
        if: steps.version.outputs.is_release == 'true'
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.*nupkg
